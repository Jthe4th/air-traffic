name: AirTraffic
options:
  bundleIdPrefix: com.feezerj
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

# DEVELOPMENT_TEAM (your signing team), AT_CONTACT, AT_TILE_URL and AT_TILE_ATTRIBUTION come from Config/App.xcconfig, with personal
# overrides in the git-ignored Config/Local.xcconfig.
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

packages:
  AirTraffic:
    path: .

targets:
  AirTraffic:
    type: application
    platform: tvOS
    sources:
      - path: Apps/tvOS
        excludes:
          - Info.plist
    dependencies:
      - package: AirTraffic
        product: OverheadUI
      - package: AirTraffic
        product: OverheadKit
    info:
      path: Apps/tvOS/Info.plist
      properties:
        CFBundleDisplayName: Air Traffic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ATReleaseChannel: $(AT_RELEASE_CHANNEL)
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: Air Traffic uses this Apple TV's approximate location to show the aircraft flying near you.
        ATContact: $(AT_CONTACT)
        ATTileURLTemplate: $(AT_TILE_URL)
        ATTileAttribution: $(AT_TILE_ATTRIBUTION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feezerj.AirTraffic
        # Version. Apple's version field allows only digits and dots, so the "-beta" in "1.0.1-beta" is the
        # AT_RELEASE_CHANNEL label, shown next to the number in the app. Bump these together; see CHANGELOG.md.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        AT_RELEASE_CHANNEL: beta
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/tvOS/Info.plist

schemes:
  AirTraffic:
    build:
      targets:
        AirTraffic: all
    run:
      config: Debug
